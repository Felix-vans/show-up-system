<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Oryn Show-Up System &mdash; Login</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 500px; margin: 80px auto; padding: 20px; background: #fafafa; color: #1a1a1a; }
        h1 { margin: 0 0 8px; text-align: center; }
        .subtitle { color: #666; text-align: center; margin-bottom: 32px; font-size: 14px; }
        .users { display: flex; flex-direction: column; gap: 12px; }
        .user-btn { display: flex; align-items: center; gap: 14px; padding: 18px 20px; background: white; border: 2px solid #eee; border-radius: 8px; font-size: 16px; font-weight: 600; color: #1a1a1a; text-decoration: none; cursor: pointer; transition: border-color 0.15s; }
        .user-btn:hover { border-color: #1a1a1a; }
        .dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
        .flash { padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; font-size: 14px; }
        .flash.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .flash.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        form { margin: 0; }
        button.user-btn { width: 100%; text-align: left; font-family: inherit; }
    </style>
</head>
<body>
    <h1>Oryn Show-Up System</h1>
    <div class="subtitle">Wie ben jij?</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <div class="users">
        {% for u in users %}
            <form method="POST" action="/login">
                <input type="hidden" name="user_id" value="{{ u.id }}">
                <button type="submit" class="user-btn">
                    <span class="dot" style="background: {{ u.color }};"></span>
                    {{ u.name }}
                </button>
            </form>
        {% endfor %}
    </div>
</body>
</html>
